# Pipeline de CI: roda testes, lint e build em todo PR e push na main/dev.
# O deploy de produção é feito pela Vercel (push na main), não por aqui.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

# Um run por ref; push novo cancela o anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome `test` é o check exigido pela proteção das branches.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
